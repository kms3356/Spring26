<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>회원가입</title>
</head>
<body>
    <h2>회원가입</h2>
    <form th:action="@{/member/register}" th:object="${memberVO}" method="post">
        <div>아이디: <input type="text" th:field="*{id}" /></div>
        <div>이름: <input type="text" th:field="*{name}" /></div>
        <div>비밀번호: <input type="password" th:field="*{password}" /></div>
        <div>이메일: <input type="text" th:field="*{emailId}" /> @ <input type="text" th:field="*{emailDomain}" /></div>
        <div>전화번호: 
	        <input type="text" th:field="*{tel1}" size="3" /> - 
	        <input type="text" th:field="*{tel2}" size="4" /> - 
	        <input type="text" th:field="*{tel3}" size="4" />
	    </div>
        <div>우편번호: <input type="text" th:field="*{post}" /></div>
        <div>기본주소: <input type="text" th:field="*{basicAddr}" /></div>
        <div>상세주소: <input type="text" th:field="*{detailAddr}" /></div>
        <div>회원구분: 
	        <input type="radio" th:field="*{type}" value="U" checked /> 일반회원
	        <input type="radio" th:field="*{type}" value="S" /> 관리자
	    </div>
        <button type="submit">가입하기</button>
    </form>
</body>
</html>
