<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script th:inline="javascript">

	document.addEventListener('DOMContentLoaded', function() {
		
		getReplyList()
		
		let listBtn = document.getElementById("lBtn")
		const mBtn = document.getElementById("mBtn")
		const dBtn = document.querySelector('#dBtn')

		listBtn.addEventListener('click', function() {
			location.href = [[@{/board}]]
			//location.href = [[@{/board}]]
		})
		
		mBtn.addEventListener('click', function() {
			// get방식
			location.href = [[@{/board/modify/{no}(no=${board.no})}]]
		})

		dBtn.addEventListener('click', async function() {
			//delete방식
			let response = await fetch([[@{/board/{no}(no=${board.no})}]], {
				method: 'delete'
			})
			
			if(response.ok) {
				alert('[[${board.no}]]번 게시글 삭제완료...')
				location.href = [[@{/board}]]
			}
		})
	})
	
	document.addEventListener('DOMContentLoaded', function() {
		/*댓글*/
		let replyAddBtn = document.getElementById('replyAddBtn')
		replyAddBtn.addEventListener('click', async function() {
			let writer = document.replyForm.writer
			let content = document.replyForm.content
			
			let response = await fetch([[@{/reply}]], {
				method: 'post',
				headers: {
					'content-type': 'application/x-www-form-urlencoded'
				},
				body: new URLSearchParams({
					content: content.value,
					writer: writer.value,
					boardNo: /*[[${board.no}]]*/ 0
				})
			})
			if(response.ok) {
				writer.value = ''
				content.value = ''
				alert('댓글등록 성공')
				getReplyList()
			} else {
				alert('댓글등록 실패')
			}
		})
	})
	
	let getReplyList = async function() {
		let boardNo = /*[[${board.no}]]*/ 0
		let params = new URLSearchParams({ boardNo: boardNo })
		let response = await fetch([[@{/reply}]] + '?' + params.toString())
		
		if(!response.ok) return
		
		let replyList = await response.json()
		document.getElementById('replyTest').innerHTML = 
				replyList.map(r =>
						`<div>${r.writer} | ${r.content} | ${r.regDate}</div>`
				).join('')		
	}
</script>
</head>
<body>
	<h2>상세게시글</h2>
	<hr>
	
	<table border="1">
		<tr>
			<th>번호</th>
			<td th:text="${board.no}"></td>
		</tr>
		<tr>
			<th>제목</th>
			<td th:text="${board.title}"></td>
		</tr>
		<tr>
			<th>작성자</th>
			<td th:text="${board.writer}"></td>
		</tr>
		<tr>
			<th>내용</th>
			<td th:text="${board.content}"></td>
		</tr>
		<tr>
			<th>조회수</th>
			<td th:text="${board.viewCnt}"></td>
		</tr>
		<tr>
			<th>등록일</th>
			<td th:text="${board.regDate}"></td>
		</tr>
		
	</table>
	
	
	<button type="button" id="lBtn">목록</button>
	<button type="button" id="mBtn">수정</button>
	<button type="button" id="dBtn">삭제</button>
	<hr>
	<form name="replyForm" enctype="application/x-www-form-urlencoded">
		댓글 : <input type="text" name="content">
		작성자 : <input type="text" name="writer">
		<button type="button" id="replyAddBtn">댓글등록</button>
	</form>
	<div id="replyTest"></div>
</body>
</html>
