<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h1>MAIN PAGE</h1>
	<h2 th:text="${message}"></h2>
	<p>
		<span th:if="${session.userVO != null}">
			user : <span th:text="${session.userVO.name}">로그인 아이디</span><br>
		</span>
		<a href="/board-mvc/board">게시판</a>
		<a href="/board-mvc/member">회원</a>
		<a th:href="@{/member/register}">
			<button type="button">회원가입</button>
		</a>
		<a th:if="${session.userVO == null}" th:href="@{/member/login}"><button type="button">로그인</button></a>
		<a th:if="${session.userVO != null}" th:href="@{/member/logout}"><button type="button">로그아웃</button></a>
	</p>
</body>
</html>
